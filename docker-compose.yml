services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepfold
      POSTGRES_PASSWORD: deepfold
      POSTGRES_DB: deepfold
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfold -d deepfold"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://deepfold:deepfold@db:5432/deepfold
      REDIS_URL: redis://redis:6379/0
      APPROVE_AND_PUBLISH_ENABLED: "false"
      KILL_SWITCH: "false"
      WP_LIVE: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEFAULT_ACTOR: journalist@newsworld.local
      PUBLISHER_NAME: Newsworld
      DEMO_INSTANT_FULFILL: "false"
      DEMO_GROK_WORKER: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  desk:
    build:
      context: ./apps/desk
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
