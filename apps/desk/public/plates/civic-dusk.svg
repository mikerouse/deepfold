<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Lit stone civic building at dusk">
  <defs>
    <linearGradient id="civic-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="42%" stop-color="#5a6a88"/>
      <stop offset="68%" stop-color="#c47a3a"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="civic-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d6458"/>
      <stop offset="100%" stop-color="#2c2620"/>
    </linearGradient>
    <filter id="civic-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#civic-sky)"/>
  <ellipse cx="1280" cy="210" rx="90" ry="90" fill="#f2e2c4" opacity="0.55"/>
  <rect x="0" y="620" width="1600" height="280" fill="#1a1612"/>
  <rect x="280" y="250" width="980" height="430" fill="url(#civic-stone)"/>
  <rect x="250" y="640" width="1040" height="28" fill="#3a342c"/>
  <rect x="720" y="160" width="140" height="90" fill="#4a433a"/>
  <polygon points="680,160 800,90 920,160" fill="#3a342c"/>
  <g fill="#d9a15a" opacity="0.85">
    <rect x="340" y="310" width="70" height="110"/>
    <rect x="460" y="310" width="70" height="110"/>
    <rect x="580" y="310" width="70" height="110"/>
    <rect x="940" y="310" width="70" height="110"/>
    <rect x="1060" y="310" width="70" height="110"/>
    <rect x="1180" y="310" width="70" height="110"/>
    <rect x="340" y="470" width="70" height="110"/>
    <rect x="460" y="470" width="70" height="110"/>
    <rect x="1060" y="470" width="70" height="110"/>
    <rect x="1180" y="470" width="70" height="110"/>
  </g>
  <rect x="740" y="470" width="100" height="170" fill="#1c1814"/>
  <rect x="0" y="0" width="1600" height="900" filter="url(#civic-grain)" opacity="0.35" fill="#fff"/>
</svg>
